<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QuickRent — Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}"/>
  <script>(function(){const t=localStorage.getItem('qr-theme')||'light';document.documentElement.classList.add(t);})();</script>
</head>
<body class="auth-page auth-page--admin">

  <div class="auth-shell">

    <div class="auth-heading">
      <div class="logo-mark logo-mark--login logo-mark--admin" aria-hidden="true">
<svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M4 21h3a2 2 0 1 1 4 0h6a2 2 0 1 1 4 0h7v-4l-3-1-2.5-5h-9L11 16l-5 1v4z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h1>QuickRent</h1>
      <p>Sign in to your QuickRent account</p>
    </div>

    <section class="auth-card">

      {% if error %}
      <div class="auth-error">
        {{ error }}
      </div>
      {% endif %}

      <form class="auth-form" method="POST" action="/login">

        <div class="auth-field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email"
                 placeholder="you@email.com" required
                 class="auth-input" autocomplete="username"/>
        </div>

        <div class="auth-field auth-field--last">
          <label for="password">Password</label>
          <input id="password" name="password" type="password"
                 placeholder="Enter your password" required
                 class="auth-input" autocomplete="current-password"/>
        </div>

        <button type="submit"
                class="auth-submit">
          Sign In
        </button>

        <p class="auth-switch">Don't have an account? <a href="/customer/register">Sign up here</a></p>

      </form>

    </section>

    <p class="auth-footer">© 2026 QuickRent</p>

  </div>

</body>
</html>
