<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QuickRent — Create Account</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}"/>
  <script>(function(){const t=localStorage.getItem('qr-theme')||'light';document.documentElement.classList.add(t);})();</script>
</head>
<body class="auth-page auth-page--register">

  <div class="auth-shell auth-shell--wide">

    <div class="auth-heading">
      <div class="logo-mark logo-mark--login logo-mark--customer" aria-hidden="true">
<svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M4 21h3a2 2 0 1 1 4 0h6a2 2 0 1 1 4 0h7v-4l-3-1-2.5-5h-9L11 16l-5 1v4z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h1>Create account</h1>
      <p>Join QuickRent to book vehicles</p>
    </div>

    <section class="auth-card auth-card--register">

      {% if success %}
      <div class="auth-message auth-message--success" role="status">
        {{ success }}
        <a href="/login">Sign in now →</a>
      </div>
      {% endif %}

      {% if error %}
      <div class="auth-message auth-message--error" role="alert">
        {{ error }}
      </div>
      {% endif %}

      <form class="auth-form auth-form--compact" method="POST" action="/customer/register">

        <div class="auth-field">
          <label for="register-name">Full name</label>
          <input id="register-name" name="name" type="text" required placeholder="Rahul Kumar" autocomplete="name" class="auth-input"/>
        </div>

        <div class="auth-field">
          <label for="register-email">Email address</label>
          <input id="register-email" name="email" type="email" required placeholder="rahul@gmail.com" autocomplete="email" class="auth-input"/>
        </div>

        <div class="auth-field">
          <label for="register-phone">Phone number</label>
          <input id="register-phone" name="phone" type="tel" placeholder="+91 98100 00000" autocomplete="tel" class="auth-input"/>
        </div>

        <div class="auth-field">
          <label for="register-city">City</label>
          <input id="register-city" name="city" type="text" placeholder="Delhi" autocomplete="address-level2" class="auth-input"/>
        </div>

        <div class="auth-field">
          <label for="register-password">Password</label>
          <input id="register-password" name="password" type="password" required placeholder="Minimum 8 characters" autocomplete="new-password" class="auth-input"/>
        </div>

        <div class="auth-field">
          <label for="register-confirm">Confirm password</label>
          <input id="register-confirm" name="confirm" type="password" required placeholder="Repeat password" autocomplete="new-password" class="auth-input"/>
        </div>

        <button type="submit" class="auth-submit">
          Create Account
        </button>

      </form>

      <p class="auth-switch">
        Already have an account? <a href="/login">Sign in</a>
      </p>

    </section>

  </div>

</body>
</html>
